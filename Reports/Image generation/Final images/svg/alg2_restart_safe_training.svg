<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="508" viewBox="0 0 1400 508"><defs></defs><line x1="10" y1="12" x2="1390" y2="12" stroke="#2F6EB5" stroke-width="2.4"/><text x="10" y="40" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Algorithm 2: Restart-safe training with early stopping</text><line x1="10" y1="66" x2="1390" y2="66" stroke="#2F6EB5" stroke-width="1.4"/><text x="44" y="94" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">1</text><text x="62" y="94" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Input: config, seed; patience 8, max 60 epochs</text><text x="44" y="128" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">2</text><text x="62" y="128" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">if run already measured then return</text><text x="44" y="162" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">3</text><text x="62" y="162" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">if last.pt exists then resume from it</text><text x="44" y="196" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">4</text><text x="62" y="196" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">for each epoch do</text><text x="44" y="230" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">5</text><text x="98" y="230" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">for each batch of 32 training windows do</text><text x="44" y="264" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">6</text><text x="134" y="264" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">loss &lt;- masked Huber + entropy penalty</text><text x="44" y="298" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">7</text><text x="134" y="298" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">AdamW step, cosine schedule</text><text x="44" y="332" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">8</text><text x="98" y="332" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">r &lt;- validation RMSE (2022)</text><text x="44" y="366" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">9</text><text x="98" y="366" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">if r improves then save ckpt.pt</text><text x="44" y="400" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">10</text><text x="98" y="400" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">save last.pt</text><text x="44" y="434" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">11</text><text x="98" y="434" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">if no improvement for 8 epochs then stop</text><text x="44" y="468" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">12</text><text x="62" y="468" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">load ckpt.pt; write metrics.json; delete last.pt</text><line x1="10" y1="492" x2="1390" y2="492" stroke="#2F6EB5" stroke-width="2.4"/></svg>