<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="542" viewBox="0 0 1400 542"><defs></defs><line x1="10" y1="12" x2="1390" y2="12" stroke="#2F6EB5" stroke-width="2.4"/><text x="10" y="40" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Algorithm 1: Quality control and latency-safe inputs</text><line x1="10" y1="66" x2="1390" y2="66" stroke="#2F6EB5" stroke-width="1.4"/><text x="44" y="94" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">1</text><text x="62" y="94" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Input: hourly series x, issue time t0</text><text x="44" y="128" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">2</text><text x="62" y="128" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">Output: inputs X, masks M, targets y</text><text x="44" y="162" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">3</text><text x="62" y="162" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">for each station and pollutant do</text><text x="44" y="196" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">4</text><text x="98" y="196" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">drop sentinels and out-of-range values</text><text x="44" y="230" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">5</text><text x="98" y="230" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">drop runs of &gt;= 6 identical hours</text><text x="44" y="264" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">6</text><text x="98" y="264" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">if |x - median24h| &gt; 6 MAD and not a city-wide spike then</text><text x="44" y="298" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">7</text><text x="134" y="298" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">x &lt;- missing</text><text x="44" y="332" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">8</text><text x="62" y="332" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">for each source k do</text><text x="44" y="366" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">9</text><text x="98" y="366" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">keep values with time &lt;= t0 - latency_k</text><text x="44" y="400" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">10</text><text x="98" y="400" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">fill gaps &lt;= 3 h forward; mask the rest</text><text x="44" y="434" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">11</text><text x="62" y="434" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">normalise X with train-year statistics</text><text x="44" y="468" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">12</text><text x="62" y="468" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="400" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">y &lt;- PM2.5 at t0+1 .. t0+48 (never filled)</text><text x="44" y="502" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="400" text-anchor="end" fill="#2F6EB5" dominant-baseline="middle">13</text><text x="62" y="502" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" text-anchor="start" fill="#1A1A1A" dominant-baseline="middle">return X, M, y</text><line x1="10" y1="526" x2="1390" y2="526" stroke="#2F6EB5" stroke-width="2.4"/></svg>