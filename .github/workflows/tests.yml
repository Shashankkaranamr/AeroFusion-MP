# CI: ML + backend tests and the frontend build on every push / PR. Runs on GitHub's machines, never on a laptop.
# Tests that need the downloaded data or the built dataset skip themselves here (data is gitignored); the integrity
# checks (no placeholder metrics, every table row has a run_id, every \cite is verified, leakage tests on synthetic
# data, model/ONNX tests) always run.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            backend/requirements.txt
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt -r backend/requirements.txt onnxscript pypdf
      - name: ML tests
        run: pytest ml/tests -q -W ignore
      - name: Backend tests
        working-directory: backend
        run: pytest tests -q -W ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
